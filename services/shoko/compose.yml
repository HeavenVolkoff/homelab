services:
  shoko:
    image: docker.io/shokoanime/server:daily@sha256:cb4258c2a54c3e585f07dd881ee9254a2421f4a07f47cb2807900f99bfb71879
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 200M
    volumes:
      - ${MEDIA_DIR:?Missing media dir}:/media/Animes:/media/Animes
      - ${ROOT_DIR:?Missing root dir}/runtime/shoko:/home/shoko/.shoko
    hostname: shoko-{{.Service.ID}}
    environment:
      AVDUMP_MONO: "true"
