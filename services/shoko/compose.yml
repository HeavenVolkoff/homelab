services:
  shoko:
    image: docker.io/shokoanime/server:daily@sha256:a82dce314537b32987f03e9f1eca665491e3c5a7c94d0e6e89bd9391264c1ab5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 200M
    volumes:
      - ${MEDIA_DIR:?Missing media dir}:/media/Animes:/media/Animes
      - ${ROOT_DIR:?Missing root dir}/runtime/shoko:/home/shoko/.shoko
    hostname: shoko-{{.Service.ID}}
    environment:
      AVDUMP_MONO: "true"
