services:
  shoko:
    image: docker.io/shokoanime/server:daily@sha256:85590cf85e8852bbb21c854c2542a5e1a238d6ff3e448b8de33784bed54e4c5a
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 200M
    volumes:
      - ${MEDIA_DIR:?Missing media dir}:/media/Animes:/media/Animes
      - ${ROOT_DIR:?Missing root dir}/runtime/shoko:/home/shoko/.shoko
    hostname: shoko-{{.Service.ID}}
    environment:
      AVDUMP_MONO: "true"
