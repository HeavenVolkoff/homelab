services:
  shoko:
    image: docker.io/shokoanime/server:daily@sha256:4b443a13e0d5a531dda34e5878eec6ce8f9a70469aca9933d1339f6a90459ee2
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 200M
    volumes:
      - ${MEDIA_DIR:?Missing media dir}:/media/Animes:/media/Animes
      - ${ROOT_DIR:?Missing root dir}/runtime/shoko:/home/shoko/.shoko
    hostname: shoko-{{.Service.ID}}
    environment:
      AVDUMP_MONO: "true"
