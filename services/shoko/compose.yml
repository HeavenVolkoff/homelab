services:
  shoko:
    image: docker.io/shokoanime/server:daily@sha256:a5995f74e0edce2e110c369a09c6e55ac68e397996b834bf6d90f7d0ac56c5ad
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 200M
    volumes:
      - ${MEDIA_DIR:?Missing media dir}:/media/Animes:/media/Animes
      - ${ROOT_DIR:?Missing root dir}/runtime/shoko:/home/shoko/.shoko
    hostname: shoko-{{.Service.ID}}
    environment:
      AVDUMP_MONO: "true"
