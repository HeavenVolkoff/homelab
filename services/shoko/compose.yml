services:
  shoko:
    image: docker.io/shokoanime/server:daily@sha256:a8aaa291b30be07ce50e9c8b911dcea8ee8c7d2cdd6afd7050ceeae44e56dcc9
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 200M
    volumes:
      - ${MEDIA_DIR:?Missing media dir}:/media/Animes:/media/Animes
      - ${ROOT_DIR:?Missing root dir}/runtime/shoko:/home/shoko/.shoko
    hostname: shoko-{{.Service.ID}}
    environment:
      AVDUMP_MONO: "true"
