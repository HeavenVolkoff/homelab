services:
  shoko:
    image: docker.io/shokoanime/server:daily@sha256:9e91d74070121fafb82ef0ca9aa79533fc8fedb8e961298aa9bcc277e6ebf400
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          memory: 200M
    volumes:
      - ${MEDIA_DIR:?Missing media dir}:/media/Animes:/media/Animes
      - ${ROOT_DIR:?Missing root dir}/runtime/shoko:/home/shoko/.shoko
    hostname: shoko-{{.Service.ID}}
    environment:
      AVDUMP_MONO: "true"
